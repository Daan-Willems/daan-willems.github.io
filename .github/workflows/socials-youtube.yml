name: Refresh socials — YouTube

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: socials-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UC0ubM_L6ISEgqr5SJfI8XTA' }}
          YT_STALE_HOURS: '24'
        run: node scripts/fetch-socials.mjs --platform youtube

      - name: Commit if changed
        # !cancelled(): the fetch step exits non-zero when a platform is past its
        # staleness threshold, and that alarm is wanted — but without this the
        # commit is skipped and the pages it just fetched are thrown away, so
        # the crawl can never accumulate its way back to fresh. Job still fails.
        if: ${{ !cancelled() }}
        run: |
          FILES="public/data/socials.youtube.json public/images/socials"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then test the index: `git diff` alone can't see a
          # newly created file, so an untracked data file would read as
          # "no changes" and never get committed.
          for f in $FILES; do
            if [ -e "$f" ]; then git add -A -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(socials): refresh youtube"
          # Each platform stages a disjoint set of paths, so a concurrent run
          # rebases cleanly rather than conflicting. Retry anyway: GitHub's git
          # replicas lag a few seconds behind a push, so this job may have
          # checked out a commit that was already stale.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 5) + 3 ))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
