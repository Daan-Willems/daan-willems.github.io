name: Refresh socials — Instagram

on:
  schedule:
    # Every hour on the :05 to avoid the bigger top-of-hour cron herd
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: socials-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Instagram
        env:
          IG_HANDLE: ${{ vars.IG_HANDLE || 'daanwillemsautomotive' }}
          IG_PAGES_PER_RUN: '3'
          # 168h (7d), not 24h: items now persist across passes, so re-walking
          # all ~140 posts daily only rediscovered what we already held. That
          # daily re-crawl is what pushed us from ~1/3 of runs making requests
          # to every run paginating, right before IG's login wall landed.
          IG_CYCLE_VALID_HOURS: '168'
          IG_STALE_HOURS: '36'
        run: node scripts/fetch-socials.mjs --platform instagram

      - name: Commit if changed
        # !cancelled(): the fetch step exits non-zero when a platform is past its
        # staleness threshold, and that alarm is wanted — but without this the
        # commit is skipped and the pages it just fetched are thrown away, so
        # the crawl can never accumulate its way back to fresh. Job still fails.
        if: ${{ !cancelled() }}
        run: |
          FILES="public/data/socials.instagram.json data/instagram-store.json public/images/socials"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then test the index: `git diff` alone can't see a
          # newly created file, so an untracked data file would read as
          # "no changes" and never get committed.
          for f in $FILES; do
            if [ -e "$f" ]; then git add -A -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(socials): refresh instagram"
          # Each platform stages a disjoint set of paths, so a concurrent run
          # rebases cleanly rather than conflicting. Retry anyway: GitHub's git
          # replicas lag a few seconds behind a push, so this job may have
          # checked out a commit that was already stale.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 5) + 3 ))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
